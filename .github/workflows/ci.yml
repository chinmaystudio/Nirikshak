name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          VITE_API_BASE_URL: https://ci-placeholder.example
      - name: No secrets or demo credentials in the bundle
        run: |
          set -e
          if grep -rEn "service_role|SUPABASE_SERVICE_ROLE_KEY|OPENROUTER_API_KEY|sk-or-v1-|#2026|@nirikshak\.local|government@gmail\.com" dist/; then
            echo "::error::Secret, server-only variable or demo credential found in the frontend bundle"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend typecheck, tests, audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and HTTP tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          if-no-files-found: error
          retention-days: 7

  database:
    name: Migrations replay + database security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild schema from migrations and run RLS / workflow tests
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash backend/supabase/test/run-db-tests.sh

  secrets:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --no-git --redact --verbose --exit-code 1 --config /repo/.gitleaks.toml
