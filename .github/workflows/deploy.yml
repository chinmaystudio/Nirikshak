name: Deploy to Vercel

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Manual production deployment
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        include:
          - app: frontend
            project_secret: VERCEL_FRONTEND_PROJECT_ID
          - app: backend
            project_secret: VERCEL_BACKEND_PROJECT_ID
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
        run: npx vercel@39.4.2 deploy --prod --yes --token="$VERCEL_TOKEN"
