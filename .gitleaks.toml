# gitleaks configuration for the CI secret scan (working tree only).
# Uses the default rule set; the allowlist covers generated assets and the
# Supabase *publishable* key, which is public by design (data is protected by
# Row Level Security, not by hiding this key).
[extend]
useDefault = true

[allowlist]
description = "Generated assets, lockfiles and public-by-design values"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)package-lock\.json$''',
  '''frontend/public/frames/''',
  '''\.(png|jpg|jpeg|webp|svg|xlsx)$''',
]
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+''',
]
